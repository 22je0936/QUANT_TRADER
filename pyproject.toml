[project]
name = "quant-trader"
version = "0.1.0"
description = "Broker-agnostic quantitative trading engine (Angel One -> Kite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "clickhouse-connect>=0.7",
    "redis>=5.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "structlog>=24.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "cryptography>=42.0",
    "httpx>=0.27",
    "websocket-client>=1.7",
    "tenacity>=8.2",
]

[project.optional-dependencies]
angel-one = [
    "smartapi-python>=1.5.5",
    "pyotp>=2.9",
    "logzero>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

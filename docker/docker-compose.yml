services:
  redis:
    image: redis:7-alpine
    container_name: quant_trader_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

# Optional storage services kept in a separate compose file for future use:
# docker compose -f docker-compose.storage.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: quant_trader_postgres
    environment:
      POSTGRES_DB: quant_trader
      POSTGRES_USER: quant_trader
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_trader"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: quant_trader_clickhouse
    environment:
      CLICKHOUSE_DB: quant_trader
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: change_me
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
